services:
  bookmark-service:
    container_name: bookmark-service
    image: bookmark-service:dev
    build: .
    depends_on:
      - redis
    ports:
      - "8080:8080"
    env_file:
      - .env
  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"