basePath: /
definitions:
  healthcheck.CheckResponse:
    properties:
      instance_id:
        type: string
      message:
        type: string
      service_name:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      detail:
        type: string
      message:
        type: string
    type: object
  response.Message:
    properties:
      message:
        type: string
    type: object
  url.CreateRequest:
    properties:
      exp:
        maximum: 84600
        minimum: 0
        type: integer
      url:
        type: string
    required:
    - url
    type: object
  url.CreateResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  user.RegisterRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - display_name
    - email
    - password
    - username
    type: object
  user.RegisterResponse:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      message:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: API for managing bookmarks
  title: Bookmark Management API
  version: "1.0"
paths:
  /health-check:
    get:
      description: Checks that the service and its dependencies are healthy.
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/healthcheck.CheckResponse'
        "500":
          description: Service is unhealthy
          schema:
            $ref: '#/definitions/response.Message'
      summary: Health check
      tags:
      - health
  /v1/links/shorten:
    post:
      description: Generates a short code for the given URL. expr is the lifetime
        in minutes (0 = never expires).
      parameters:
      - description: URL to shorten
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/url.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Generated short code
          schema:
            $ref: '#/definitions/url.CreateResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Create short URL
      tags:
      - links
  /v1/links/shorten/{code}:
    get:
      description: Looks up the short code and redirects (301) to the original URL
        via the Location header.
      parameters:
      - description: Short code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "301":
          description: Redirect to original URL (see Location header)
          headers:
            Location:
              description: Original URL
              type: string
          schema:
            type: string
        "400":
          description: Invalid query
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: URL not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Redirect to original URL
      tags:
      - links
  /v1/users/register:
    post:
      description: User registers.
      parameters:
      - description: Register payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Generated user
          schema:
            $ref: '#/definitions/user.RegisterResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register account
      tags:
      - users
swagger: "2.0"
